<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14212B"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sydrail"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>sydrail 노선도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 전체 화면 노선도 → 역을 누르면 [출발·도착·상세] 메뉴.
   출발 = 아래에서 올라오는 창(끌어 올리면 전체 화면) / 도착 = 경로(소요시간·환승) 화면 / 상세 = 역 출발 보드.
   펼친 화면(폭 700px 이상)에서는 창·경로 화면을 가운데 760px로 */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#14212B; --muted:#5B6B76; --rule:#D5DDE2;
  --accent:#A85A22; --ok:#1C7A4B; --ok-bg:#E2F2E9; --no:#7D8893; --no-bg:#EEF0F2; --late:#B0471A;
  --menu:#2A3640; --menu-ink:#F2F5F7; --shadow:0 -6px 24px rgba(20,33,43,.18);
  --t1:#E8960F; --t2:#0A86BD; --t3:#D4502A; --t4:#1D5FAE; --t5:#B5287E; --t6:#7A4A2A; --t7:#6C7C88; --t8:#0E8A4C; --t9:#C62832; --m1:#11807F;
  --rdot:#E5322D;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#172129; --ink:#E6EDF1; --muted:#93A3AE; --rule:#26343E;
  --accent:#D9925A; --ok:#4CC38A; --ok-bg:#16352A; --no:#7F8D98; --no-bg:#1D2932; --late:#F0905E;
  --menu:#E6EDF1; --menu-ink:#14212B; --shadow:0 -6px 24px rgba(0,0,0,.5);
  --t1:#F2AE3D; --t2:#3DB3E6; --t3:#EE7650; --t4:#5B93E0; --t5:#E060AE; --t6:#B98058; --t7:#9AAAB5; --t8:#35B871; --t9:#F0646C; --m1:#2FB3B0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#172129; --ink:#E6EDF1; --muted:#93A3AE; --rule:#26343E;
  --accent:#D9925A; --ok:#4CC38A; --ok-bg:#16352A; --no:#7F8D98; --no-bg:#1D2932; --late:#F0905E;
  --menu:#E6EDF1; --menu-ink:#14212B; --shadow:0 -6px 24px rgba(0,0,0,.5);
  --t1:#F2AE3D; --t2:#3DB3E6; --t3:#EE7650; --t4:#5B93E0; --t5:#E060AE; --t6:#B98058; --t7:#9AAAB5; --t8:#35B871; --t9:#F0646C; --m1:#2FB3B0; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 역을 눌렀을 때 사각형(초점 테두리·안드로이드 누름 표시)은 그리지 않음 — 깜박이는 동그라미만(2026-11-07 사용자 요청) */
#map .st:focus,#map .st:focus-visible,#map .lab:focus,#map g:focus{outline:none}
html,body,#map,#map *{-webkit-tap-highlight-color:transparent}
.badge{font-family:var(--display);font-weight:700;font-size:15px;color:#fff;border-radius:5px;padding:1px 7px;line-height:1.35;white-space:nowrap}
.via{color:var(--muted);font-size:13px}
.sample{background:var(--no-bg);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.sample b{color:var(--accent)}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--no-bg)}

/* ===== 노선도 ===== */
.mapview{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.maphead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);background:var(--surface)}
.maphead{align-items:center;flex-wrap:nowrap;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;flex:none}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:9px 36px 9px 34px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .qicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.search .qclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
@media (max-width:380px){.brand{display:none}}
/* 검색 결과·즐겨찾기 목록 (검색창 아래로 펼쳐짐) */
.sugg{position:absolute;left:0;right:0;z-index:15;max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);border-bottom:1px solid var(--rule);box-shadow:0 10px 24px rgba(20,33,43,.18);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:4px 8px}
.sugg h3{margin:10px 8px 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.srow{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;border:0;background:transparent;text-align:left;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:15px;min-height:44px}
.srow:hover,.srow.on{background:var(--no-bg)}
.srow .sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sname b{color:var(--accent)}
.srow .slines{display:flex;gap:3px;flex:none}
.srow .slines .chip{font-size:12px;padding:0 5px}
.srow .sstar{flex:none;width:36px;height:36px;border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;border-radius:50%}
.srow .sstar[aria-pressed="true"]{color:var(--accent)}
.srow .rk{flex:none;color:var(--accent);width:20px;text-align:center}
.snone{padding:12px 8px;color:var(--muted);font-size:14px}
/* 언어 고르기 */
.langbtn{flex:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer}
.langmenu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));z-index:25;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:0 10px 24px rgba(20,33,43,.22);padding:6px;display:flex;flex-direction:column;min-width:160px}
.langmenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;font-size:15px;cursor:pointer;min-height:44px}
.langmenu button:hover{background:var(--no-bg)}
.langmenu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.langmenu .flag{font-size:22px;line-height:1}
.reset{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;align-self:center}
#map .dimmed .ln{opacity:.18}
#map .rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
#map .rt.halo{stroke:var(--surface);stroke-width:14}
#map .rt.main{stroke-width:9}
#map .rt.draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:rtdraw linear both}
@keyframes rtdraw{to{stroke-dashoffset:0}}
#map .rdot{fill:var(--rdot);pointer-events:none;transform-box:fill-box;transform-origin:center;animation:rdot .35s cubic-bezier(.3,1.6,.5,1) both}
#map .rdot.end{stroke:var(--surface);stroke-width:2}
@keyframes rdot{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.routebar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:3;width:min(560px,calc(100% - 24px));
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}
.routebar{cursor:pointer}
.rsame{margin:6px 0 2px;color:var(--muted);font-size:13px}
.door{color:var(--ink);font-weight:700}
.ractions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.ract{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
.nearbtn{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.routebar .rb-t{flex:1;min-width:0;font-size:14px}
.routebar .rb-t b{font-family:var(--display);font-size:22px;margin-right:6px}
.routebar .rb-t span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routebar button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.dragging{cursor:grabbing}
#map .ln{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
#map .lab{font-family:var(--body);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:bounding-box;cursor:pointer}
#map .st{cursor:pointer}
#map .st .hit{fill:transparent;stroke:none}
#map .st circle.mk{fill:var(--surface);stroke:var(--ink);stroke-width:2.2}
#map .st.small circle.mk{stroke:var(--muted);stroke-width:2}
#map .st.picked circle.mk{stroke:var(--accent);stroke-width:4}
/* 누른 역: 동그라미를 강조색으로 채우고 바깥 고리가 퍼지며 깜빡인다(그 역 창·메뉴가 열려 있는 동안) */
#map .st.sel circle.mk{fill:var(--accent);stroke:var(--surface);stroke-width:3;animation:selblink 1s ease-in-out infinite}
@keyframes selblink{0%,100%{fill:var(--accent)}50%{fill:var(--surface)}}
#map .st.sel .lab{font-weight:700;fill:var(--accent)}
#map .selring{fill:none;stroke:var(--accent);stroke-width:3;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:selpulse 1.4s ease-out infinite}
@keyframes selpulse{0%{transform:scale(.9);opacity:.95}70%{transform:scale(2.1);opacity:0}100%{transform:scale(2.1);opacity:0}}
#map .pin text{font-family:var(--body);font-size:12px;font-weight:700;fill:#fff;pointer-events:none}
.mapbox.hasbar .legend,.mapbox.hasbar .zoom{bottom:84px}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-wrap:wrap;gap:5px;max-width:calc(100% - 90px);pointer-events:none}
.chip{font-family:var(--display);font-weight:700;font-size:13px;color:#fff;border-radius:5px;padding:1px 7px}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);
  font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;z-index:20}
.toast.on{opacity:1}
/* 역 메뉴 (출발·도착·상세) */
.menu{position:absolute;z-index:4;display:flex;background:var(--menu);color:var(--menu-ink);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.menu::after{content:"";position:absolute;left:var(--ax,50%);bottom:-6px;width:12px;height:12px;background:var(--menu);transform:translateX(-50%) rotate(45deg)}
.menu.below::after{bottom:auto;top:-6px}
.menu button{border:0;background:transparent;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 16px;cursor:pointer;font-size:14px;font-weight:700;position:relative;z-index:1}
.menu button+button{border-left:1px solid color-mix(in srgb,var(--menu-ink) 18%,transparent)}
.menu button span{font-size:18px;line-height:1}
.menu .mtitle{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:12px;font-weight:700;color:var(--ink)}
.menu.below .mtitle{top:auto;bottom:-22px}

/* ===== 아래에서 올라오는 창 ===== */
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;z-index:6;
  height:calc(100% - env(safe-area-inset-top,0px) - 8px);display:flex;flex-direction:column;
  background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);transition:transform .25s ease;will-change:transform}
.sheet.dragging{transition:none}
.grab{touch-action:none;cursor:grab;padding:6px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));flex:none}
.handle{display:block;width:44px;height:5px;border-radius:3px;background:var(--rule);margin:2px auto 6px}
.shead{display:flex;align-items:center;gap:8px}
.shead .linechips{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto}
.lchip{border:2px solid transparent;border-radius:999px;padding:2px;background:transparent;cursor:pointer}
.lchip[aria-pressed="true"]{border-color:var(--ink)}
.lchip .badge{display:block}
.sbody{flex:1;min-height:0;overflow:hidden;touch-action:pan-y;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet:not(.full) .sbody{touch-action:none}
.sheet.full .sbody{overflow:auto}
.lbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--lc);border-radius:999px;height:34px;color:#fff;font-size:14px;margin-top:4px;flex:none}
.lbar .pv{padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .nx{padding-right:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .cur{background:var(--surface);color:var(--ink);border:3px solid var(--lc);border-radius:999px;padding:4px 18px;font-weight:700;font-size:16px;white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;flex:none}
.cols>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.cols>div+div{border-left:1px solid var(--rule);padding-left:14px}
.cols .d{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.cols .d em{font-style:normal;color:var(--late);font-weight:700}
.cols .none{font-size:13px;color:var(--muted)}
.topreset{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:8px;z-index:2;color:var(--accent);border-color:var(--accent);padding:5px 12px}
.pbtn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
.pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;background:var(--no-bg);border-radius:10px;padding:8px 12px;flex:none}
.pick b{color:var(--accent)}
.dsel{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);max-width:100%}
.uphint{font-size:12px;color:var(--muted);text-align:center;flex:none}
.sheet.full .uphint{display:none}

/* ===== 역 보드 (상세 / 창을 끝까지 올렸을 때) ===== */
.page{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:7;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#boardHost{display:flex;flex-direction:column;gap:12px}
#sheetBoard{display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 14px 5px 10px;font-size:14px;cursor:pointer}
header.bh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.where{display:flex;flex-direction:column;gap:2px}
.where small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.where h1{margin:0;font-family:var(--display);font-weight:700;font-size:34px;line-height:1;text-wrap:balance}
.clock{font-size:28px;font-weight:600;color:var(--muted)}
.bctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px}
.next{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px;border-radius:10px;background:var(--ok-bg)}
.next .k{font-size:13px;color:var(--ok);font-weight:700}
.next .v{font-family:var(--display);font-size:24px;font-weight:600}
.controls{display:flex;align-items:center;gap:10px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--rule);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.page .board{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--rule);cursor:pointer}
.row:first-child{border-top:0}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row[aria-expanded="true"]{background:var(--no-bg)}
.row.dim .mid{opacity:.62}
.mins{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.mins small{font-size:15px;font-weight:600;color:var(--muted);margin-left:1px}
.mins.now{color:var(--accent);font-size:22px}
.mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dest{font-weight:700}
.late{color:var(--late);font-size:13px;font-weight:700}
.faretype{margin:2px 0 8px}.faretype button{flex:1;font-size:12px;padding:6px 3px;white-space:nowrap}
.farenote{color:var(--muted);font-size:13px;margin:-6px 0 4px}
.sample.live{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.sample.live b{color:var(--ok)}
.fast{color:var(--ok);font-size:12px;font-weight:700;border:1px solid var(--ok);border-radius:4px;padding:0 5px}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;text-align:center}
.tag.yes{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--no-bg);color:var(--no)}

  padding-top:calc(48px + env(safe-area-inset-top,0px));padding-bottom:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

function liveTrip(ev, st, nowMod){
  const raw = ev.dest || '', via = (raw.match(/ via (.+)$/)||[])[1] || '';
  const dest = raw.replace(/ via .+$/,'').replace(/ Station.*$/,'').replace(/,.*$/,'').trim();
  const fix = m => m < nowMod - 720 ? m + 1440 : m > nowMod + 720 ? m - 1440 : m;   // 자정 넘김
  const dep = fix(sydMod(ev.est || ev.planned)), sched = fix(sydMod(ev.planned));
  let best = null;
  for(const svc of SERVICES){
    if(svc.line !== ev.line) continue;
    const total = svc.stops[svc.stops.length-1][1];
    for(const dir of ['f','r']){
      const seq = dir==='f' ? svc.stops : svc.stops.slice().reverse().map(([n,o])=>[n,total-o]);
      const i = seq.findIndex(x=>x[0]===st); if(i<0) continue;
      const j = dest==='City Circle' ? (svc.loop && dir==='f' ? seq.length-1 : -1) : seq.findIndex((x,k)=>k>i && x[0]===dest);
      if(j<0) continue;
      const viaOk = !via || seq.slice(i, j+1).some(x=>x[0].includes(via) || via.includes(x[0]));
      const sc = (viaOk ? 0 : 10) + j - i;
      if(!best || sc < best.sc) best = {svc, dir, seq, i, j, sc};
    }
  }
  const times = best ? best.seq.slice(best.i, best.j+1).map(([n,o])=>({st:n, t:dep+o-best.seq[best.i][1], s:sched+o-best.seq[best.i][1]})) : [{st, t:dep, s:sched}];
  return {id:'L'+ev.line+ev.planned+dest, svc:best?.svc || {line:ev.line, via:''}, line:ev.line, dir:best?.dir || 'f', dest:dest || '?',
    via: via ? 'via '+via : (best?.svc.via || ''), delay:Math.max(0, ev.late||0), times, live:true, platform:ev.platform, cancelled:ev.cancelled};
}

      const dest = dir==='f' && svc.loop ? 'City Circle' : seq[seq.length-1][0];

const el = (tag, attrs={}, parent=svg) => { const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent.appendChild(e); return e; };
let pinLayer, lineLayer, routeLayer, dotLayer;

function drawMap(){
  // 1) 구간마다 지나는 노선 모으기
  const segKey = (a,b) => a<b ? a+'|'+b : b+'|'+a;
  const segLines = {}, stLines = {}, stMax = {};
  for(const D of DRAW) for(let i=0;i<D.path.length-1;i++){
    const k = segKey(D.path[i], D.path[i+1]);
    (segLines[k] ||= new Set()).add(D.id+(D.dash?'d':''));
  }
  for(const D of DRAW) for(const n of D.path) if(n[0]!=='@') (stLines[n] ||= new Set()).add(D.id);
  // 2) 선 그리기 (구간마다 수직 방향으로 벌려서 나란히)
  lineLayer = el('g');
  const order = id => LINE_ORDER.indexOf(id.replace('d','')) + (id.endsWith('d')?0.5:0);
  for(const D of DRAW){
    const me = D.id+(D.dash?'d':'');
    for(let i=0;i<D.path.length-1;i++){
      const a = D.path[i], b = D.path[i+1], k = segKey(a,b);
      const ids = [...segLines[k]].sort((x,y)=>order(x)-order(y)), n = ids.length, off = (ids.indexOf(me)-(n-1)/2)*GAP;
      const [p, q] = a<b ? [coord(a), coord(b)] : [coord(b), coord(a)];
      const len = Math.hypot(q[0]-p[0], q[1]-p[1]) || 1, nx = -(q[1]-p[1])/len*off, ny = (q[0]-p[0])/len*off;
      const A = coord(a), B = coord(b);
      el('line',{class:'ln', x1:A[0]+nx, y1:A[1]+ny, x2:B[0]+nx, y2:B[1]+ny, stroke:LINE_COLOR[D.id], ...(D.dash?{'stroke-dasharray':'2 8'}:{})}, lineLayer);
      for(const s of [a,b]) if(s[0]!=='@') stMax[s] = Math.max(stMax[s]||1, n);
    }
  }
  routeLayer = el('g');
  // 3) 역 표시
  const gs = el('g');
  for(const [name,x,y,pos] of ST){
    const multi = (stLines[name]?.size||1) > 1, r = Math.max(multi?8:6, (stMax[name]||1)*GAP/2 + 3), o = r + 7, d = r*0.7 + 3;
    const g = el('g',{class:'st'+(multi?'':' small'), 'data-name':name, tabindex:0, role:'button', 'aria-label':name}, gs);
    el('circle',{class:'hit',cx:x,cy:y,r:Math.max(15,r+4)},g);
    el('circle',{class:'mk',cx:x,cy:y,r},g);
    const L = {r:[o,5,'start'], l:[-o,5,'end'], t:[0,-o+2,'middle'], b:[0,o+10,'middle'], tl:[-o+4,-o+4,'end'],
      ul:[-d,-d,'end',45], dl:[-d,d+8,'end',-45], dr:[d,d+8,'start',45]}[pos];
    const tx = x+L[0], ty = y+L[1];
    const t = el('text',{class:'lab',x:tx,y:ty,'text-anchor':L[2], ...(L[3]?{transform:`rotate(${L[3]} ${tx} ${ty})`}:{})},g);
    t.textContent = name;
  }
  dotLayer = el('g');                                      // 경로 역 채우기(역 표시 위)
  pinLayer = el('g');
  renderLegend();
}
function drawPins(){
  pinLayer.innerHTML = '';
  for(const [st,label,color] of [[od.from,T('출발'),'var(--accent)'],[od.to,T('도착'),'var(--ok)']]){
    if(!st || !POS[st]) continue;
    const [x,y] = POS[st];
    const g = el('g',{class:'pin'},pinLayer);
    el('rect',{x:x-19,y:y-40,width:38,height:20,rx:10,fill:color},g);
    el('path',{d:`M${x-5} ${y-21} L${x} ${y-13} L${x+5} ${y-21} Z`,fill:color},g);
    const t = el('text',{x,y:y-26,'text-anchor':'middle'},g); t.textContent = label;
  }
  svg.querySelectorAll('.st').forEach(g=>g.classList.toggle('picked', g.dataset.name===od.from||g.dataset.name===od.to));
}

// ----- 경로를 노선도 위에 색으로 -----
// 두 역 사이를 그 노선 그림의 역 순서대로 따라감(급행이 건너뛴 역·꺾이는 점 포함)
function segPath(line, a, b){
  let best = null;
  for(const D of DRAW){
    if(D.id !== line) continue;
    D.path.forEach((n,i)=>{ if(n!==a) return; D.path.forEach((m,j)=>{ if(m===b && (!best || Math.abs(i-j) < Math.abs(best.i-best.j))) best = {p:D.path, i, j}; }); });
  }
  if(!best) return [coord(a), coord(b)];
  const {p, i, j} = best;
  return (i<j ? p.slice(i, j+1) : p.slice(j, i+1).reverse()).map(coord);
}
let shownLegs = null;
function drawRoute(legs){
  routeLayer.innerHTML = ''; dotLayer.innerHTML = ''; shownLegs = legs;
  lineLayer.classList.toggle('dimmed', !!legs);
  if(!legs) return [];
  // 지나가는 역 순서(갈아타는 역은 한 번만)와 한 역당 움직임 시간
  const seq = [];
  for(const g of legs) for(const x of g.trip.times.slice(g.bi, g.ai+1)) if(POS[x.st] && seq[seq.length-1]!==x.st) seq.push(x.st);
  const step = Math.min(110, 1800/Math.max(seq.length-1,1));     // 역이 많아도 1.8초 안에 끝
  const all = [];
  let k = 0;                                                     // 이 구간 첫 역이 seq에서 몇 번째인지
  for(const g of legs){
    const st = g.trip.times.slice(g.bi, g.ai+1).map(x=>x.st).filter(n=>POS[n]);
    let path = [];
    for(let i=0; i<st.length-1; i++){ const p = segPath(g.trip.line, st[i], st[i+1]); path = path.concat(i ? p.slice(1) : p); }
    if(path.length >= 2){
      const pts = path.map(p=>p.join(',')).join(' ');
      // 선이 출발역에서 도착역 쪽으로 그려지며 따라간다
      const anim = `animation-delay:${Math.round(k*step)}ms;animation-duration:${Math.round((st.length-1)*step)}ms`;
      el('polyline',{class:'rt halo draw', points:pts, pathLength:1, style:anim}, routeLayer);
      el('polyline',{class:'rt main draw', points:pts, stroke:LINE_COLOR[g.trip.line], pathLength:1, style:anim}, routeLayer);
      all.push(...path);
    }
    k += Math.max(st.length-1, 0);
  }
  // 역 동그라미를 출발역부터 도착역까지 차례로 빨간색으로 채운다
  const marks = Object.fromEntries([...svg.querySelectorAll('.st')].map(g=>[g.dataset.name, g.querySelector('circle.mk')]));
  seq.forEach((n,i)=>{
    const [x,y] = POS[n], r = +(marks[n]?.dataset.r || marks[n]?.getAttribute('r') || 6);
    const end = i===0 || i===seq.length-1;
    el('circle',{class:'rdot'+(end?' end':''), cx:x, cy:y, r:Math.max(4, r*(end?0.8:0.62)), style:`animation-delay:${Math.round(i*step)}ms`}, dotLayer);
  });
  return all;
}
function fitTo(points){
  if(!points.length) return;
  const xs = points.map(p=>p[0]), ys = points.map(p=>p[1]);
  const r = svg.getBoundingClientRect(), ar = r.height/Math.max(r.width,1);
  const pad = 70, x0 = Math.min(...xs)-pad, x1 = Math.max(...xs)+pad, y0 = Math.min(...ys)-pad, y1 = Math.max(...ys)+pad+60;
  let w = Math.max(x1-x0, (y1-y0)/ar, 300); w = Math.min(w, 2600);
  vb = {w, h:w*ar, x:(x0+x1)/2-w/2, y:(y0+y1)/2-(w*ar)/2}; applyVB();
}
function showRouteBar(legs){
  const bar = $('routebar');
  if(!legs){ bar.hidden = true; $('mapbox').classList.remove('hasbar'); return; }
  const dep = legs[0].trip.times[legs[0].bi].t, last = legs[legs.length-1], arr = last.trip.times[last.ai].t;
  $('rbText').innerHTML = `<b>${T('{n}분',{n:Math.round(arr-dep)})}</b>${hhmm(dep)} → ${hhmm(arr)} · ${legs.length>1?T('환승 {n}회',{n:legs.length-1}):T('환승 없음')}<span>${esc(od.from)} → ${esc(od.to)} · ${legs.map(g=>g.trip.line).join(' → ')}</span>`;
  bar.hidden = false; $('mapbox').classList.add('hasbar');
}
function updateReset(){ $('resetBtn').hidden = !(od.from || od.to); }
function resetOD(){
  od.from = null; od.to = null;
  drawPins(); drawRoute(null); showRouteBar(null); closeSheet(); updateReset();
  toast(T('출발·도착을 지웠어요.'));
}
$('resetBtn').addEventListener('click', resetOD);
$('routebar').addEventListener('click', ()=>openRoute());

// ----- 끌기·확대 -----
let vb = {x:0,y:0,w:1000,h:1000};
function homeView(){
  const r = svg.getBoundingClientRect(); const ar = r.height/Math.max(r.width,1);
  const w = r.width >= 700 ? 820 : 520;
  vb = {w, h:w*ar, x:1010-w/2, y:1060-(w*ar)/2}; applyVB();
}
function applyVB(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); hideMenu(); }
function zoomAt(f, cx, cy){
  const nw = Math.min(2600, Math.max(220, vb.w*f)); f = nw/vb.w;
  vb.x = cx-(cx-vb.x)*f; vb.y = cy-(cy-vb.y)*f; vb.w = nw; vb.h *= f; applyVB();
}
function toMap(cx, cy){ const r = svg.getBoundingClientRect(); return [vb.x+(cx-r.left)/r.width*vb.w, vb.y+(cy-r.top)/r.height*vb.h]; }
function toScreen(x, y){ const r = svg.getBoundingClientRect(); return [(x-vb.x)/vb.w*r.width, (y-vb.y)/vb.h*r.height]; }
const ptrs = new Map(); let moved = 0, pinch0 = null;
svg.addEventListener('pointerdown', e=>{
  svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) moved = 0;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0 = Math.hypot(a.x-b.x,a.y-b.y); }
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', e=>{
  const p = ptrs.get(e.pointerId); if(!p) return;
  const r = svg.getBoundingClientRect();
  if(ptrs.size===1){
    const dx=e.clientX-p.x, dy=e.clientY-p.y; moved += Math.abs(dx)+Math.abs(dy);
    if(moved > 6){ vb.x -= dx/r.width*vb.w; vb.y -= dy/r.height*vb.h; applyVB(); }
  }
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2){
    moved = 99;
    const [a,b]=[...ptrs.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0){ const [cx,cy]=toMap((a.x+b.x)/2,(a.y+b.y)/2); zoomAt(pinch0/d,cx,cy); }
    pinch0 = d;
  }
});
// 손가락으로 고르기 좋은 배율(화면 px / 노선도 단위). 역 사이가 대개 32단위라 약 45px이 된다
const TAP_SCALE = 1.4, TAP_PX = 30;
let vbAnim = null, vbTarget = null;
function animateVB(to, ms, done){
  cancelAnimationFrame(vbAnim); vbTarget = to; const from = {...vb}, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now-t0)/ms), e = 1-Math.pow(1-k, 3);
    for(const key of ['x','y','w','h']) vb[key] = from[key] + (to[key]-from[key])*e;
    applyVB();
    if(k < 1) vbAnim = requestAnimationFrame(step); else { vbTarget = null; if(done) done(); }
  };
  vbAnim = requestAnimationFrame(step);
}
// 두 번 누르기: 누른 자리를 그대로 두고 2배 확대(움직이는 중이면 도착할 화면 기준)
// 첫 번째 누르기 때 화면이 멀리 보기였으면 → 첫 누르기가 이미 확대하므로 그대로(= 확대)
// 이미 확대돼 있었으면 → 전체 보기(⌂)로 돌아간다. 첫 누르기로 열린 역 창은 닫는다
let lastTap = {t:0, x:0, y:0, far:false, opened:false};
function isDoubleTap(cx, cy){
  const now = performance.now(), dbl = now-lastTap.t < 350 && Math.hypot(cx-lastTap.x, cy-lastTap.y) < 40;
  const prev = lastTap;
  lastTap = dbl ? {t:0, x:0, y:0, far:false, opened:false} : {t:now, x:cx, y:cy, far:svg.getBoundingClientRect().width/vb.w < TAP_SCALE*0.8, opened:false};
  return dbl ? prev : null;
}
function dblToggle(prev){
  if(prev.far) return;                                         // 멀리 보기에서 두 번 → 첫 누르기의 확대로 충분
  hideMenu(); if(prev.opened) closeSheet();
  const keep = {...vb}; cancelAnimationFrame(vbAnim); vbTarget = null;
  fitTo(Object.values(POS)); const home = {...vb}; vb = keep; applyVB();   // 전체 노선도를 계산만 하고 부드럽게 이동
  animateVB(home, 300);
}
function tapNear(cx, cy, hit){
  const r = svg.getBoundingClientRect(), scale = r.width/vb.w;
  const near = Object.entries(POS).map(([n,[x,y]])=>{ const [sx,sy] = toScreen(x,y); return [n, Math.hypot(sx-(cx-r.left), sy-(cy-r.top))]; })
    .filter(a=>a[1] <= TAP_PX).sort((a,b)=>a[1]-b[1]);
  if(!near.length && !hit && scale >= TAP_SCALE*0.8) return false;                    // 확대된 상태에서 빈 곳: 원래대로
  const one = hit ? hit.dataset.name : near.length && (near.length===1 || near[0][1] < near[1][1]*0.6) ? near[0][0] : null;
  if(scale >= TAP_SCALE*0.8){ if(one && !hit){ openStation(one); return true; } return false; }   // 이미 충분히 크다
  const [mx, my] = one ? POS[one] : toMap(cx, cy);
  const [px, py] = one ? toScreen(...POS[one]) : [cx-r.left, cy-r.top];               // 누른 자리는 화면에서 그대로
  const w = r.width/TAP_SCALE, h = vb.h*w/vb.w;
  hideMenu();
  animateVB({x: mx - px/r.width*w, y: my - py/r.height*h, w, h}, 320, ()=>{ if(one) openStation(one); else if(near.length > 1) toast(T('가까운 역이 여러 개예요. 원하는 역을 눌러 주세요.')); });
  return true;
}
function endPtr(e){
  const was = ptrs.size; ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch0=null;
  if(!ptrs.size) svg.classList.remove('dragging');
  if(was===1 && moved < 8 && e.type==='pointerup'){
    const hit = document.elementFromPoint(e.clientX,e.clientY)?.closest('.st');
    const dbl = isDoubleTap(e.clientX, e.clientY);
    if(dbl){ dblToggle(dbl); return; }
    const was = sheet.hidden;
    if(tapNear(e.clientX, e.clientY, hit)){ lastTap.opened = was && !sheet.hidden; return; }
    if(hit){ openStation(hit.dataset.name); lastTap.opened = was && !sheet.hidden; }
    else { hideMenu(); if(!sheet.hidden && sh.mode==='info' && !sh.full) closeSheet(); else if(sheet.hidden) markSel(null); }
  }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);

let toastTimer;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2600); }

// ----- 역 메뉴 -----
let menuStation = null;
function showMenu(name){
  menuStation = name;
  const m = $('menu'); $('mtitle').textContent = name; m.hidden = false;
  const box = $('mapbox').getBoundingClientRect();
  const [sx, sy] = toScreen(...POS[name]);
  const w = m.offsetWidth, h = m.offsetHeight;
  const below = sy - h - 48 < 0;
  const left = Math.min(Math.max(8, sx - w/2), box.width - w - 8);
  m.style.left = left+'px';
  m.style.top = (below ? sy + 24 : sy - h - 18)+'px';
  m.classList.toggle('below', below);
  m.style.setProperty('--ax', Math.min(Math.max(14, sx-left), w-14)+'px');
}
function hideMenu(){ $('menu').hidden = true; menuStation = null; }
// 역(동그라미·이름)을 누르면: 아래에 그 역 정보 창(작게) + 역 위에 [출발·도착·상세] 메뉴. 경로를 본 뒤에도 항상 같다.
// 누른 역 강조(하나만). null이면 지운다
function markSel(name){
  svg.querySelectorAll('.st.sel').forEach(g=>{
    g.classList.remove('sel'); g.querySelector('.selring')?.remove();
    const m = g.querySelector('circle.mk'); if(m.dataset.r) m.setAttribute('r', m.dataset.r);   // 원래 크기로
  });
  if(!name) return;
  const g = [...svg.querySelectorAll('.st')].find(x=>x.dataset.name===name); if(!g) return;
  const mk = g.querySelector('circle.mk');
  mk.dataset.r = mk.dataset.r || mk.getAttribute('r');
  mk.setAttribute('r', Math.max(11, +mk.dataset.r * 1.7));           // 누른 역은 더 크게
  g.classList.add('sel');
  el('circle',{class:'selring', cx:mk.getAttribute('cx'), cy:mk.getAttribute('cy'), r:mk.getAttribute('r')}, g);
  g.parentNode.appendChild(g);                                   // 다른 역 위로 올려 그림
}
function openStation(name){
  openSheet(name, 'info'); markSel(name);
  requestAnimationFrame(()=>{
    const box = $('mapbox').getBoundingClientRect(), r = svg.getBoundingClientRect();
    const [, sy] = toScreen(...POS[name]);
    const limit = box.height - peekPx() - 40;                     // 창 위로 보이는 높이
    if(sy > limit || sy < 90){
      const want = Math.max(110, limit*0.55);
      vb.y += (sy - want)/r.height*vb.h; applyVB();
    }
    showMenu(name);
  });
}
$('menu').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || !menuStation) return;
  const st = menuStation; hideMenu();
  if(b.dataset.act==='info') openBoardPage(st);
  else if(b.dataset.act==='from') setFrom(st);
  else setTo(st);
});

const od = {from:null, to:null};
// 출발·도착이 다 정해지면 경로 화면 대신 노선도에서 경로를 움직임으로 보여 준다(자세히는 아래 [경로 보기])
function showRouteOnMap(){
  closeSheet(); hideMenu();
  const legs = getRoutes(queryTime(), od.from, od.to)[routeMode];
  routeLegs = legs;
  if(!legs) return openRoute();                                    // 갈 수 있는 열차가 없으면 경로 화면에서 안내
  fitTo(drawRoute(legs)); showRouteBar(legs);
}
function setFrom(st){
  if(st===od.to) od.to = null;
  od.from = st; drawPins(); updateReset(); drawRoute(null); showRouteBar(null);
  if(od.to) return showRouteOnMap();
  openSheet(st, 'from');
}
function setTo(st){
  if(st===od.from){ toast(T('출발역과 같은 역이에요. 다른 역을 골라 주세요.')); return; }
  od.to = st; drawPins(); updateReset(); drawRoute(null); showRouteBar(null);
  if(od.from) return showRouteOnMap();
  openSheet(st, 'to');
  toast(T('출발역을 노선도에서 누르거나 아래 목록에서 골라 주세요.'));
}

// 4) 출발 창 (아래 약 20% → 끌어 올리면 전체 화면)

const sheet = $('sheet');
let sh = {st:null, mode:'from', line:null, full:false, y:0};
function peekPx(){ return Math.round(Math.min(300, Math.max(230, innerHeight*0.24))); }
function placeSheet(full){
  sh.full = full; sheet.classList.toggle('full', full);
  sh.y = full ? 0 : sheet.offsetHeight - peekPx();
  sheet.style.transform = `translateY(${sh.y}px)`;
  if(!full) $('sbody').scrollTop = 0;
}
function openSheet(st, mode){
  sh = {...sh, st, mode, line: linesAt(st)[0], full:false};
  board.st = st; board.selected = null; board.only = false;
  board.dest = mode==='from' ? (od.to || store('dest-'+st) || FAV_DEST[st] || '') : mode==='info' ? (store('dest-'+st) || FAV_DEST[st] || '') : '';
  if(board.dest && !directDests(st).includes(board.dest)) board.dest = '';
  sheet.hidden = false;
  renderSheet();
  requestAnimationFrame(()=>placeSheet(false));
}
function closeSheet(){ sheet.hidden = true; markSel(null); }
function renderSheet(){
  if(sheet.hidden) return;
  const st = sh.st, now = sydneyNow();
  $('lineChips').innerHTML = linesAt(st).map(L=>`<button class="lchip" data-line="${L}" aria-pressed="${L===sh.line}" aria-label="${T('{l} 노선',{l:L})}"><span class="badge" style="background:${LINE_COLOR[L]}">${L}</span></button>`).join('');
  $('shNear').textContent = '📍 '+T('주변정보');
  $('shMode').textContent = T({from:'출발역', to:'도착역', info:'역 정보'}[sh.mode]);
  $('shMode').className = 'tag ' + (sh.mode==='to' ? 'nx' : 'yes');
  // 고른 노선에서 이 역의 앞·뒤 역
  const svc = SERVICES.find(s=>s.line===sh.line && s.stops.some(x=>x[0]===st));
  const i = svc.stops.findIndex(x=>x[0]===st);
  const pv = svc.stops[i-1]?.[0], nx = svc.stops[i+1]?.[0];
  const deps = departuresAt(now, st, null).filter(d=>d.trip.line===sh.line);
  const col = dir => {
    const ds = deps.filter(d=>d.trip.dir===dir).slice(0,3);
    if(!ds.length) return '<span class="none">'+T('지금 열차 없음')+'</span>';
    return ds.map(d=>`<span class="d">${esc(destTxt(d.trip.dest))}${d.trip.line==='T8'?` <span class="via">${esc(T(d.trip.via))}</span>`:''} <em class="num">${d.trip.cancelled?T('취소'):d.away<1?T('곧 도착'):T('{n}분',{n:Math.floor(d.away)})}</em>${d.trip.delay?` <span class="late">+${d.trip.delay}</span>`:''}${d.trip.platform?` <span class="via">P${esc(d.trip.platform)}</span>`:''}</span>`).join('');
  };
  const others = ALL_STATIONS.filter(s=>s!==st);
  const pick = sh.mode==='info'
    ? `<div class="pick"><b>${esc(st)}</b><button class="pbtn" data-go="from">${T('↗ 여기서 출발')}</button><button class="pbtn" data-go="to">${T('↙ 여기로 도착')}</button></div>`
    : sh.mode==='from'
    ? `<div class="pick"><b>${T('출발')} ${esc(st)}</b> → ${T('도착역')} <select class="dsel" id="sheetPick" aria-label="${T('도착역 고르기')}"><option value="">${T('고르기')}</option>${others.map(s=>`<option${s===od.to?' selected':''}>${esc(s)}</option>`).join('')}</select><span class="via">${T('또는 노선도에서 역을 눌러 [도착]')}</span></div>`
    : `<div class="pick">${T('출발역')} <select class="dsel" id="sheetPick" aria-label="${T('출발역 고르기')}"><option value="">${T('고르기')}</option>${others.map(s=>`<option>${esc(s)}</option>`).join('')}</select> → <b>${T('도착')} ${esc(st)}</b></div>`;
  $('sbody').innerHTML = `
    <div class="lbar" style="--lc:${LINE_COLOR[sh.line]}"><span class="pv">${pv?'‹ '+esc(pv):''}</span><span class="cur">${esc(st)}</span><span class="nx">${nx?esc(nx)+' ›':''}</span></div>
    <div class="cols"><div>${col('r')}</div><div>${col('f')}</div></div>
    ${pick}
    <div class="uphint">${T('▲ 위로 밀면 이 역의 전체 출발 정보가 나와요')}</div>
    ${liveNote(st)}
    <div id="sheetBoard"></div>`;
  renderBoard($('sheetBoard'), false);
}
$('lineChips').addEventListener('click', e=>{ const b=e.target.closest('.lchip'); if(b){ sh.line=b.dataset.line; renderSheet(); } });
$('shClose').addEventListener('click', closeSheet);
$('shNear').addEventListener('click', e=>{ e.stopPropagation(); openUrl('https://www.google.com/maps/search/?api=1&query='+placeQ(sh.st)); });
$('sbody').addEventListener('click', e=>{
  const b = e.target.closest('[data-go]'); if(!b) return;
  hideMenu(); b.dataset.go==='from' ? setFrom(sh.st) : setTo(sh.st);
});
$('sbody').addEventListener('change', e=>{

// 끌어 올리기·내리기 (작은 창일 때는 어디를 밀어도 되고, 전체 화면에서는 손잡이로 내림)
let drag = null;
sheet.addEventListener('pointerdown', e=>{
  if(e.target.closest('button,select,input,label')) return;
  if(sh.full && !e.target.closest('#grab')) return;
  drag = {y0:e.clientY, base:sh.y, moved:0, id:e.pointerId};
  sheet.classList.add('dragging');
});
sheet.addEventListener('pointermove', e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dy = e.clientY - drag.y0; drag.moved = Math.max(drag.moved, Math.abs(dy));
  if(drag.moved > 6 && !sheet.hasPointerCapture(e.pointerId)) sheet.setPointerCapture(e.pointerId);
  const maxY = sheet.offsetHeight - peekPx();
  sh.y = Math.min(maxY + 80, Math.max(0, drag.base + dy));
  sheet.style.transform = `translateY(${sh.y}px)`;
});
function dragEnd(e){
  if(!drag || e.pointerId!==drag.id) return;
  sheet.classList.remove('dragging');
  const maxY = sheet.offsetHeight - peekPx(), wasFull = sh.full;
  if(drag.moved < 6){ if(e.target.closest('#grab')) placeSheet(!sh.full); else placeSheet(sh.full); }
  else if(sh.y > maxY + 50) closeSheet();
  else placeSheet(wasFull ? sh.y < maxY*0.35 : sh.y < maxY*0.8);
  drag = null;
}
sheet.addEventListener('pointerup', dragEnd);
sheet.addEventListener('pointercancel', dragEnd);

const board = {st:null, dest:'', only:false, selected:null, isPage:false};
let boardHostEl = null;
const wide = matchMedia('(min-width:700px)');
function minsHTML(a){ return a<1 ? '<span class="mins now">'+T('곧 도착')+'</span>' : `<span class="mins">${Math.floor(a)}<small>${T('분')}</small></span>`; }
function rowHTML(d){
  const t = d.trip, nxt = t.times[d.i+1]?.st;
  const tag = board.dest
    ? (d.goes ? `<span class="tag yes">${esc(board.dest)} <span class="num">${hhmm(d.targetAt)}</span></span>` : `<span class="tag no">${esc(T('{d} 안 감',{d:board.dest}))}</span>`)
    : `<span class="tag nx">${esc(T('다음 {s}',{s:nxt}))}</span>`;
  return `<button class="row${board.dest&&!d.goes?' dim':''}" data-id="${d.id}" aria-expanded="${d.id===board.selected}">
    ${minsHTML(d.away)}
    <span class="mid">
      <span class="top"><span class="badge" style="background:${LINE_COLOR[t.line]}">${t.line}</span>
        <span class="dest">${esc(t.dest)}</span>${t.cancelled?`<span class="late">${T('취소')}</span>`:''}${t.delay?`<span class="late">${T('+{n}분 지연',{n:t.delay})}</span>`:''}${t.platform?`<span class="tag nx">${T('{n}번 승강장',{n:t.platform})}</span>`:''}${d.fastest?'<span class="fast">'+T('가장 빨리 도착')+'</span>':''}</span>
      <span class="via">${esc(T(t.via))} · ${T('{t} 출발',{t:hhmm(d.dep)})}</span>
    </span>${tag}</button>`;
}
function detailHTML(d, list, cls){
  const t = d.trip, lc = LINE_COLOR[t.line], seq = t.times.slice(d.i);
  const items = seq.map((x,k)=>{
    const gap = k>0 && x.t-seq[k-1].t>8 ? `<li class="gap" style="--lc:${lc}"><span class="dot"></span><span class="sn">${T('… 중간 역 생략')}</span><span></span></li>` : '';
    return gap+`<li class="${x.st===board.dest||k===0?'key':''}" style="--lc:${lc}"><span class="dot"></span>
      <span class="sn">${esc(x.st)}${x.st===board.dest?' ✓':''}</span>
      <span class="st">${t.delay?`<s>${hhmm(x.s)}</s>`:''}${hhmm(x.t)}</span></li>`;
  }).join('');
  let miss = '';
  if(board.dest && !d.goes){
    const alt = list.filter(x=>x.goes && x.dep>=d.dep).reduce((a,x)=>!a||x.targetAt<a.targetAt?x:a,null);
    miss = `<div class="miss">${esc(T('이 열차는 {d}에 서지 않아요.',{d:board.dest}))}${alt?` ${T('가장 빨리 가는 열차는 <b>{a}</b> 출발 {l}, <b>{b}</b> 도착이에요.',{a:hhmm(alt.dep),l:alt.trip.line,b:hhmm(alt.targetAt)})}`:''}</div>`;
  }
  return `<section class="detail ${cls}">
    <h2><span class="badge" style="background:${lc}">${t.line}</span> ${esc(destTxt(t.dest))} <span class="via">${esc(T(t.via))}</span></h2>
    <p class="note">${T('각 역 도착 예정 시각')}${t.delay?` · ${T('{n}분 늦어진 시각(취소선은 원래 시각)',{n:t.delay})}`:' · '+T('정시')}</p>
    <ol class="stops">${items}</ol>${miss}</section>`;
}
function renderBoard(host, isPage){
  boardHostEl = host; board.isPage = isPage;
  const now = sydneyNow(), st = board.st;
  const all = departuresAt(now, st, board.dest);
  const someMiss = !!board.dest && all.some(d=>!d.goes);
  const list = board.only && someMiss ? all.filter(d=>d.goes) : all;
  if(!list.find(d=>d.id===board.selected)) board.selected = (all.find(d=>d.fastest) || list[0] || {}).id;
  const sel = all.find(d=>d.id===board.selected);
  const best = board.dest ? all.find(d=>d.fastest) : null;
  const two = isPage && wide.matches;
  const rows = list.slice(0,12).map(d=>rowHTML(d)+(!two&&d.id===board.selected?detailHTML(d,all,''):'')).join('');
  host.innerHTML = `
    ${isPage?`<header class="bh"><div class="where"><small>${T('역 출발 정보 · 시드니 시각')}</small><h1>${esc(st)}</h1></div><div class="clock num">${hhmm(Math.floor(now.mod))}</div></header>
      ${liveNote(st)}`:''}
    <div class="bctl">
      <label for="bDest">${T('도착역')} <select class="dsel" id="bDest"><option value="">${T('고르지 않음')}</option>${directDests(st).map(s=>`<option${s===board.dest?' selected':''}>${esc(s)}</option>`).join('')}</select></label>
      ${someMiss||board.only?`<label class="controls" for="bOnly"><span class="switch"><input type="checkbox" id="bOnly"${board.only?' checked':''}><span></span></span>${esc(T('{d} 가는 열차만',{d:board.dest}))}</label>`:''}
    </div>
    ${best?`<div class="next"><span class="k">${esc(T('{d} 가장 빨리',{d:board.dest}))}</span><span class="v">${T('{a} 출발 → {b} 도착',{a:hhmm(best.dep),b:hhmm(best.targetAt)})}</span><span class="via">${best.trip.line} ${esc(T(best.trip.via))} · ${best.away<1?T('곧 도착'):T('{n}분 후',{n:Math.floor(best.away)})}</span></div>`:''}
    <div class="board"><div class="list">${rows||'<div class="empty">'+T('지금 이 역에 서는 열차가 없어요(견본 시간표 기준).')+'</div>'}</div>${two&&sel?detailHTML(sel,all,'side'):''}</div>
    <p class="foot">${T('도착역 목록에는 갈아타지 않고 갈 수 있는 역만 나와요. 갈아타야 하면 노선도에서 [출발] → [도착]으로 경로를 찾으세요.')}</p>`;
}
document.addEventListener('click', e=>{
  if(!boardHostEl || !boardHostEl.contains(e.target)) return;
  const r = e.target.closest('.row'); if(r){ board.selected = r.dataset.id; renderBoard(boardHostEl, board.isPage); }

function openBoardPage(st){

let routeMode = 'fast', routeLegs = null;
// 출발 시각: 'now' 또는 날짜(0=오늘,1=내일,2=모레) + 시각
const when = {day:'now', time:'08:00'};
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WD_KO = {Sun:'일',Mon:'월',Tue:'화',Wed:'수',Thu:'목',Fri:'금',Sat:'토'};
function queryTime(){
  const now = sydneyNow();
  if(when.day==='now') return now;
  const y=+now.ymd.slice(0,4), m=+now.ymd.slice(4,6), d=+now.ymd.slice(6,8);
  const dt = new Date(Date.UTC(y, m-1, d + when.day));
  const [hh, mm] = when.time.split(':').map(Number);
  return {mod: hh*60+mm, weekday: WD[dt.getUTCDay()],
    ymd: dt.getUTCFullYear()+String(dt.getUTCMonth()+1).padStart(2,'0')+String(dt.getUTCDate()).padStart(2,'0'), planned:true};
}
function whenHTML(qt){
  const days = [['now',T('지금')],[0,T('오늘')],[1,T('내일')],[2,T('모레')]];
  return `<div class="when"><span>${T('출발')}</span>
    <div class="seg" role="group" aria-label="${T('출발 날짜')}">${days.map(([v,l])=>`<button data-day="${v}" aria-pressed="${String(when.day)===String(v)}">${l}</button>`).join('')}</div>
    ${when.day==='now'?'':`<input type="time" class="tinput" id="whenTime" value="${when.time}" aria-label="${T('출발 시각')}"><span class="via">${T('{w}요일 기준',{w:wdName(qt.weekday)})}</span>`}
  </div>`;
}

// ----- 역 이름 검색: 영어로 치면 비슷한 역을 바로 보여 준다 -----
// 맞는 정도(작을수록 위): 같음 0 · 앞부분 1 · 단어 앞부분 2 · 머리글자(sj→St James) 3 · 중간 포함 4 · 오타 1~2자 5 · 글자 순서만 맞음 6
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
const SEARCH_IX = ALL_STATIONS.map(name=>{
  const words = name.toLowerCase().split(/[\s-]+/);
  const keys = words.map((w,i)=>norm(words.slice(i).join('')));          // 'st james' → ['stjames','james']
  words.forEach(w=>{ if(w==='st') keys.push('saint'); if(w==='mount') keys.push('mt'); });
  if(/airport/i.test(name)) keys.push('airport');
  return {name, n:norm(name), keys, ini:words.map(w=>w[0]).join('')};
});
function lev(a, b){                                                    // 글자 고치기 횟수(오타 거리)
  const d = Array.from({length:a.length+1}, (_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
  {
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);   // 두 글자 순서 바뀜도 1번
  }
  return d[a.length][b.length];
}
function isSubseq(q, n){ let i=0; for(const c of n) if(c===q[i]) i++; return i===q.length; }
function searchStations(raw){
  const q = norm(raw); if(!q) return [];
  const out = [];
  for(const e of SEARCH_IX){
    let sc = 99;
    if(e.n===q) sc = 0;
    else if(e.n.startsWith(q)) sc = 1;
    else if(e.keys.some(k=>k.startsWith(q))) sc = 2;
    else if(q.length>=2 && e.ini.startsWith(q)) sc = 3;
    else if(e.n.includes(q)) sc = 4;
    else if(q.length>=4){
      const tol = q.length>=7 ? 2 : 1;
      const dist = Math.min(...e.keys.map(k=>Math.min(lev(q, k.slice(0,q.length)), lev(q, k))));
      if(dist<=tol) sc = 5 + dist/10;                                   // 오타가 적을수록 위
    }
    if(sc===99 && q.length>=3 && isSubseq(q, e.n)) sc = 6;
    if(sc<99) out.push([sc, e.name]);
  }
  return out.sort((a,b)=>a[0]-b[0] || a[1].length-b[1].length || a[1].localeCompare(b[1])).slice(0,12).map(x=>x[1]);
}
function hilite(name, raw){
  const t = raw.trim(); const i = t ? name.toLowerCase().indexOf(t.toLowerCase()) : -1;
  return i<0 ? esc(name) : esc(name.slice(0,i))+'<b>'+esc(name.slice(i,i+t.length))+'</b>'+esc(name.slice(i+t.length));
}
const lineChips = n => linesAt(n).map(L=>`<span class="chip" style="background:${LINE_COLOR[L]}">${L==='M1'?'M':L}</span>`).join('');
const stRow = (n, raw='') => `<div class="srow" role="option" data-st="${esc(n)}"><span class="sname">${hilite(n, raw)}</span><span class="slines">${lineChips(n)}</span>`

function renderSugg(){

// ----- Opal 요금(성인, 호주 달러) — 교통국 공식 요금표(transportnsw.info Adult Opal fares, 2026-11 확인) -----
// 기차·메트로: 거리 구간별 [출퇴근 시간 요금, 그 밖의 시간(30% 할인)]. 출퇴근 시간 = 월~목(공휴일 제외) 06:30~10:00, 15:00~19:00 (탄 시각 기준)

const OPAL = {
  adult: {rail:[[10, 4.33, 3.03], [20, 5.38, 3.76], [35, 6.20, 4.34], [65, 8.28, 5.79], [Infinity, 10.66, 7.46]], cap:[19.30, 9.65], air:18.61},

  gold:  {rail:[[Infinity, 2.50, 2.50]], cap:[2.50, 2.50], air:16.64},   // 골드(노인·연금): 하루 $2.50이 상한이라 한 번 타면 $2.50
};
const FARE_NAMES = {adult:'성인', child:'어린이·청소년', conc:'할인', gold:'골드'};
let fareType = (()=>{ try{ const v = localStorage.getItem('fareType'); return OPAL[v] ? v : 'adult'; }catch(e){ return 'adult'; } })();
const AIRPORT_FEE = OPAL.adult.air;
const NSW_HOLIDAYS = ['20260101','20260126','20260403','20260404','20260405','20260406','20260425','20260608','20261005','20261225','20261226','20261228',
  '20270101','20270126','20270326','20270327','20270328','20270329','20270425','20270614','20271004','20271225','20271226','20271227','20271228'];   // NSW 공휴일(대략, 교통국 기준 확인 필요)
const km = (a, b) => { const A = STOPLL[a], B = STOPLL[b]; if(!A || !B) return 0; const r = Math.PI/180, x = (B[1]-A[1])*r*Math.cos((A[0]+B[0])/2*r), y = (B[0]-A[0])*r; return 6371*Math.hypot(x, y); };
function opalFare(legs, q){
  let dist = 0, airport = false;
  for(const g of legs){
    const ts = g.trip.times.slice(g.bi, g.ai+1);
    for(let i=1;i<ts.length;i++) dist += km(ts[i-1].st, ts[i].st);
    if([ts[0].st, ts[ts.length-1].st].some(n=>/Airport/.test(n))) airport = true;
  }
  const tapOn = legs[0].trip.times[legs[0].bi].t, m = ((tapOn%1440)+1440)%1440;
  const holiday = NSW_HOLIDAYS.includes(q.ymd), monThu = ['Mon','Tue','Wed','Thu'].includes(q.weekday) && !holiday;
  const peak = monThu && ((m >= 390 && m < 600) || (m >= 900 && m < 1140));
  const F = OPAL[fareType], band = F.rail.find(b=>dist <= b[0]);
  const base = peak ? band[1] : band[2];
  return {dist, peak, base, airport, air:F.air, total: base + (airport ? F.air : 0), cap: monThu ? F.cap[0] : F.cap[1]};
}
const aud = v => 'A$' + v.toFixed(2);
// 앱 안(WebView)이면 앱 본체에 부탁하고, 브라우저면 브라우저 기능을 쓴다
const toApp = msg => { if(window.ReactNativeWebView){ window.ReactNativeWebView.postMessage(JSON.stringify(msg)); return true; } return false; };
const placeQ = n => encodeURIComponent(n+' Station, Sydney NSW');
function routeText(){
  const legs = routeLegs; if(!legs) return od.from+' → '+od.to;
  const dep = legs[0].trip.times[legs[0].bi].t, last = legs[legs.length-1], arr = last.trip.times[last.ai].t, x = legs.length-1;
  const lines = [`Sydney Trains · ${od.from} → ${od.to}`, `${T('{n}분',{n:Math.round(arr-dep)})} · ${x?T('환승 {n}회',{n:x}):T('환승 없음')}`];
  legs.forEach(g=>{ const b = g.trip.times[g.bi], a = g.trip.times[g.ai]; lines.push(`${hhmm(b.t)} ${b.st} (${g.trip.line}) → ${hhmm(a.t)} ${a.st}`); });
  return lines.join('\n');
}
function shareRoute(){
  const text = routeText();
  if(toApp({type:'share', text})) return;
  if(navigator.share){ navigator.share({text}).catch(()=>{}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>toast(T('경로를 복사했어요. 원하는 앱에 붙여 넣으세요.')), ()=>{});
}

const I18N_NODES = [];
function collectStatic(){
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for(let n; (n = w.nextNode());){ const k = n.nodeValue.trim(); if(k && L10N[k] && !n.parentElement.closest('script,style,#langMenu')) I18N_NODES.push([n, null, k]); }
  document.querySelectorAll('[placeholder],[aria-label]').forEach(e=>{
    for(const a of ['placeholder','aria-label']){ const k = e.getAttribute(a); if(k && L10N[k]) I18N_NODES.push([e, a, k]); }
  });
}
function renderLegend(){
  $('legend').innerHTML = LINE_ORDER.map(k=>`<span class="chip" style="background:${LINE_COLOR[k]}">${k==='M1'?T('메트로'):k}</span>`).join('');
}
function applyLang(lang, first){
  LANG = ['ko','en','zh','ms','ta','ja'].includes(lang) ? lang : 'ko';
  try{ localStorage.setItem('lang', LANG); }catch(e){}
  document.documentElement.lang = {ko:'ko', en:'en', zh:'zh-CN', ms:'ms', ta:'ta', ja:'ja'}[LANG];
  for(const [n,a,k] of I18N_NODES){
    const v = T(k);
    if(a) n.setAttribute(a, v);
    else { const cur = n.nodeValue.trim(); n.nodeValue = n.nodeValue.replace(cur, v); }
  }
  document.querySelectorAll('#langMenu [data-lang]').forEach(b=>b.setAttribute('aria-checked', b.dataset.lang===LANG));
  $('langBtn').setAttribute('aria-label', T('언어')+' (Lang)');
  if(first) return;
  live.tr = null; fetchAlerts();                            // 운행 안내를 새 언어 번역으로 다시 받음
  // 열려 있는 화면을 새 언어로 다시 그린다
  renderLegend(); renderFavs(); drawPins();
  if(!$('routebar').hidden && shownLegs) showRouteBar(shownLegs);
  if(!sheet.hidden) renderSheet();
  if(!$('boardview').hidden) renderBoard($('boardHost'), true);
  if(!$('routeview').hidden) renderRoute();
  if(!$('sugg').hidden) renderSugg();
  if(!$('alerts').hidden) openAlerts(false);
  if(menuStation) showMenu(menuStation);
}
function closeLang(){ $('langMenu').hidden = true; $('langBtn').setAttribute('aria-expanded','false'); }
$('langBtn').addEventListener('click', e=>{

$('langMenu').addEventListener('click', e=>{
  const b = e.target.closest('[data-lang]'); if(!b) return;
  closeLang(); applyLang(b.dataset.lang);
});
document.addEventListener('pointerdown', e=>{ if(!$('langMenu').hidden && !e.target.closest('#langMenu,#langBtn')) closeLang(); });

window.sydrailBack = () => {
  if(!$('langMenu').hidden) return closeLang();

};
collectStatic();                                     // 화면에 처음부터 있는 문구(버튼·안내)를 기억해 두고 언어에 맞게 바꾼다
